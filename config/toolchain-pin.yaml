# Single source of truth for the toolchain both Hermes hosts must run.
#
# The Mac holds this pin. A change is applied to both hosts in ONE window, because
# the code-review-graph schema migration (9 -> 15 in 2.4.0) is forward-only: a host
# left behind cannot read a graph the other host has opened, and every read then errors.
#
# Consumers: mac/parity-check.sh (report drift, exit 1) and mac/parity-apply.sh
# (apply to both hosts or abort). Neither is allowed to open the other host's
# graph.db with a newer binary — cross-host inspection reads the sqlite `metadata`
# table only.

schema: 1
updated: "2026-11-20"
updated_by: hermes-mac

crg:
  version: "2.4.0"
  graph_schema: 15                       # graph.db metadata.schema_version written by 2.4.0; forward-only
  install: >-
    Both hosts install into a venv, never the system interpreter: this host
    $HOME/.local/venvs/crg/bin/python3, dockerVM /root/.local/venvs/crg/bin/python3.
    The CLI on PATH is a symlink to that venv's console script on both
    ($HOME/.local/bin/code-review-graph here, /usr/local/bin/code-review-graph there), and the
    MCP server entry names the venv python directly. Verified 2026-11-20 on both hosts.
  reason: >-
    Fixes the uvx/multi-copy preference that let an older copy answer a newer graph,
    and makes `install --platform dsh` write the home-level $DSH_HOME/cordis.patch.yml
    that only dsh 0.2.2-rc.5 composes. (`doctor` exists on main, not in 2.4.0.)

embeddings:
  provider: "local"
  model: "all-MiniLM-L6-v2"            # sentence-transformers id - MUST be identical on both
  extra: "code-review-graph[embeddings]"
  torch: "2.15.0"                       # vm uses the +cpu wheel from download.pytorch.org/whl/cpu
  sentence_transformers: "6.3.0"
  embeddable: "Function, Class, Test, DocSection"   # File/JsonPath/YamlPath carry no prose
  reason: >-
    A second, silent drift axis: node and edge counts are identical whether or not
    embeddings exist, so two hosts on different models answer the same semantic query
    differently while every count you diff still matches. Same model, or semantic
    results stop being comparable.
  counts:                               # measured, not estimated
    harness_mac: 146786                 # = nodes - File rows; the embedder takes every non-File node
    harness_vm: 146784                  # 2 fewer Class nodes on that parse
  verify: "list_graph_stats_tool reports 'Embeddings: N nodes embedded'; `status --json` has no embeddings key at all, so an absent key is not zero. N == nodes - File nodes, on both hosts."
  rule: >-
    Embedded set is EVERY node kind except File (YamlPath and JsonPath included - measured by
    subtracting File rows from the node total on two builds, and by a semantic hit landing on a
    YamlPath node). A rebuild prunes embeddings for removed nodes by itself: after the ignore-file
    rebuild the table held exactly the surviving nodes with 0 orphans, so no re-embed was needed.

harness_graph:                          # measured 2026-11-20 at f3881ec040, after the ignore fix
  files: 9505                            # exact on both hosts - the strongest single check
  mac: {nodes: 156291, edges: 1939391, embeddings: 146786}
  vm:  {nodes: 156289, edges: 1939387, embeddings: 146784}   # measured there, verified here
  residual: >-
    2 nodes and 4 edges, and it is Class: the VM parses 12,970 where this host parses 12,972. Each
    class carries one CONTAINS and one REFERENCES edge, so the edge delta is 2 + 2. Every other kind
    matches exactly, at two different baselines, which is what makes it a parser difference rather
    than drift.
  rule: >-
    Compare rebuild-to-rebuild only: a forget+update pass leaves ~3,000 CALLS/TESTED_BY edges behind
    and the same tree then reports a smaller graph. The build summary's edge tally is pre-dedupe
    (1,960,431 printed against 1,939,387 stored on the VM's rebuild) - quote status --json or
    list_graph_stats_tool. Embeddings == nodes - File rows, and a rebuild prunes the orphans itself.

dsh:
  repo: "rpmalouin/deepseek-harness"
  sha: "f3881ec040"
  version: "0.2.2-rc.5"
  node_min: "24.9.0"
  pnpm: "11.28.5"
  build: each host builds its own node_modules — darwin and linux output is not shareable
  reason: >-
    f3881ec040 is 8255317b0f plus two graph-noise commits: the .code-review-graphignore itself
    (6817d90309) and the fix that made its package.json/tsconfig patterns actually match nested
    paths (f3881ec040). A host on an earlier sha indexes 26,164 more nodes of build config and its
    baseline is not comparable.

wrapper:
  path_in_repo: "shared/bin/dsh-wrapper.sh"
  install:
    mac: "$HOME/.local/bin/dsh"
    vm: "/usr/local/bin/dsh"

hosts:
  mac:
    crg_python: "$HOME/.local/venvs/crg/bin/python3"
    crg_copies_expected: 1
    checkout: "$HOME/Data/Development/deepseek-harness"
    node_search: ["/opt/homebrew/bin/node", "/usr/local/bin/node"]
    permission_mode: "workspace-write"
    key_file: "$HOME/.hermes/.env"
    dsh_home: "$HOME/.dsh"
  vm:
    ssh: "dockervm"                    # `ssh dockervm` from the Mac; read by parity_check/parity-apply
    crg_python: "/root/.local/venvs/crg/bin/python3"   # venv, matching the Mac's pattern
    crg_copies_expected: 1
    checkout: "/appdata/deepseek-harness"
    node_search: ["/root/.hermes/tools/node-*-linux-x64/bin/node", "/usr/local/bin/node", "/usr/bin/node"]
    permission_mode: "danger-full-access"   # workspace-write has no usable backend there
    key_file: "/root/.hermes/.env"
    dsh_home: "/root/.dsh"
